  '@tailwindcss/oxide>@tailwindcss/oxide-win32-arm64-msvc': '-'
  '@tailwindcss/oxide>@tailwindcss/oxide-win32-x64-msvc': '-'
  # Keep esbuild on the patched release across the workspace.
  esbuild: 0.28.1
  # Orval's older Scalar utility pins an affected undici release; force its
  # compatible patched 7.x version without changing unrelated undici 8.x users.
  '@scalar/json-magic@0.15.7>undici': 7.30.1
  esbuild>@esbuild/aix-ppc64: '-'
  esbuild>@esbuild/android-arm: '-'
  esbuild>@esbuild/android-arm64: '-'
  esbuild>@esbuild/android-x64: '-'
