kind = "web"
previewPath = "/"
title = "Beauty Manager"
description = "Gestão completa para negócios de beleza, com agenda, controle diário de atendimentos, financeiro, clientes, profissionais, estoque, vendas de prótese capilar, planos de assinatura e permissões por cargo."
version = "1.0.0"
id = "artifacts/barber-manager"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23945

[services.development]
run = "pnpm --filter @workspace/barber-manager run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/barber-manager", "run", "build" ]
serve = "static"
publicDir = "artifacts/barber-manager/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23945"
BASE_PATH = "/"
